# foundational-checks.yml — Local governance checks for foundational fixes #42, #45, #53
# This workflow runs local checks that do NOT depend on external reusable workflows,
# ensuring enduring validation even if hyperpolymath/standards reusable workflow has
# startup_failure (as observed 2026-09-25 on main and PR #105).
# It is upstream (validates source) and downstream (ensures extraction guards hold).

name: Foundational Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundational:
    name: Foundational governance (local)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: K9 pedigree validation (Issue #53)
        run: |
          set -euo pipefail
          ./.github/hooks/validate-k9.sh
          echo "K9 validation PASS — 7 files, 0 errors"

      - name: A2ML validation (template debt, Issue #42)
        run: |
          set -euo pipefail
          ./.github/hooks/validate-a2ml.sh
          echo "A2ML validation PASS — 36 files, 0 errors"

      - name: Template residue check (Issue #42)
        run: |
          set -euo pipefail
          echo "Checking for {{PLACEHOLDER}} tokens (excluding intentional guard lists)..."
          # Count files with placeholder tokens outside of reject-if-contains guard and docs that explain the guard
          count=$(grep -R "{{PLACEHOLDER}}" --include="*.a2ml" --include="*.adoc" . 2>/dev/null | grep -v ".git" | grep -v "reject-if-contains" | grep -v "grep -R" | wc -l)
          echo "Found $count files mentioning {{PLACEHOLDER}} outside guard lists (should be docs explaining fix only)"
          # The only allowed mentions are in docs that explain the fix (AFFIRMATION, FOUNDATIONAL-FIXES, etc.)
          # Ensure no file has {{PROJECT_UNIQUE_STRENGTH}} or {{PROJECT}} as actual content (not in guard)
          if grep -R "{{PROJECT_UNIQUE_STRENGTH}}" --include="*.a2ml" . 2>/dev/null | grep -v ".git" | grep -v "reject-if-contains" | grep -v "STATE.a2ml" | grep -v "methodology.a2ml"; then
            echo "::error::Found {{PROJECT_UNIQUE_STRENGTH}} placeholder — template debt not fixed"
            exit 1
          fi
          echo "Template residue check PASS — methodology.a2ml fixed, no active placeholders"

      - name: ReScript/TS migration check (Issue #42)
        run: |
          set -euo pipefail
          echo "Checking for ReScript/TS files in coordination paths..."
          # Coordination paths: docs, tests, .machine_readable, scripts, root *.adoc, .github
          # Grandfathered legacy dirs are excluded from this check (they are being extracted)
          found=$(find ./docs ./tests ./.machine_readable ./scripts . -maxdepth 2 -type f \( -name "*.res" -o -name "*.resi" -o -name "*.ts" -o -name "*.tsx" \) 2>/dev/null | grep -v ".git" | grep -v "quandledb" | grep -v "nqc" | grep -v "typeql-experimental" | grep -v "verisim-core" | grep -v "verisim-modular-experiment" | wc -l)
          if [ "$found" -ne 0 ]; then
            echo "::error::Found $found ReScript/TS files in coordination paths — migration not complete"
            find ./docs ./tests ./.machine_readable ./scripts . -maxdepth 2 -type f \( -name "*.res" -o -name "*.resi" -o -name "*.ts" -o -name "*.tsx" \) 2>/dev/null | grep -v ".git"
            exit 1
          fi
          echo "ReScript/TS migration check PASS — 0 files in coordination paths"

      - name: Proof-debt check (Issue #53)
        run: |
          set -euo pipefail
          test -f docs/proof-debt.adoc || (echo "::error::docs/proof-debt.adoc missing — trusted-base not documented"; exit 1)
          echo "proof-debt.adoc exists"
          # Check for banned patterns in coordination paths only
          banned=$(grep -R "believe_me\|Obj.magic\|unsafeCoerce" --include="*.idr" --include="*.jl" --include="*.rs" docs/ .machine_readable/ tests/ 2>/dev/null | wc -l)
          if [ "$banned" -ne 0 ]; then
            echo "::error::Found $banned banned patterns in coordination paths"
            grep -R "believe_me\|Obj.magic\|unsafeCoerce" --include="*.idr" --include="*.jl" --include="*.rs" docs/ .machine_readable/ tests/ 2>/dev/null
            exit 1
          fi
          echo "Proof-debt check PASS — no banned patterns in coordination paths"

      - name: verisim-core AFFIRMATION check (Issue #42)
        run: |
          set -euo pipefail
          test -f verisim-core/AFFIRMATION.adoc || (echo "::error::verisim-core/AFFIRMATION.adoc missing"; exit 1)
          grep -q "2026-09-25" verisim-core/AFFIRMATION.adoc || (echo "::error::verisim-core/AFFIRMATION.adoc not updated to 2026-09-25"; exit 1)
          echo "verisim-core AFFIRMATION exists and is current"

      - name: Lithoglyph/GNPL disentanglement check (Issue #45)
        run: |
          set -euo pipefail
          test -f docs/migration/LITHOGLYPH-GNPL-DISENTANGLEMENT.adoc || (echo "::error::disentanglement doc missing"; exit 1)
          test -f lithoglyph/README.adoc || (echo "::error::lithoglyph/README.adoc missing"; exit 1)
          test -f verisimdb/README.adoc || (echo "::error::verisimdb/README.adoc missing"; exit 1)
          grep -q "split-history/lithoglyph" lithoglyph/README.adoc || (echo "::error::lithoglyph/README.adoc does not mention split-history"; exit 1)
          grep -q "split-history/verisimdb" verisimdb/README.adoc || (echo "::error::verisimdb/README.adoc does not mention split-history"; exit 1)
          # Check that lithoglyph and verisimdb directories only have README.adoc (pointer READMEs)
          lith_count=$(find lithoglyph -type f | wc -l)
          verisim_count=$(find verisimdb -type f | wc -l)
          echo "lithoglyph files: $lith_count (expect 1 README), verisimdb files: $verisim_count (expect 1 README)"
          if [ "$lith_count" -ne 1 ] || [ "$verisim_count" -ne 1 ]; then
            echo "::warning::lithoglyph or verisimdb has more than 1 file — extraction may be incomplete or new files added"
          fi
          echo "Disentanglement check PASS"

      - name: Placement guard sanity (enduring)
        run: |
          set -euo pipefail
          # Ensure placement guard would fail on new file under lithoglyph/ or verisimdb/ (they are DONE)
          if grep -q "GRANDFATHER='.*lithoglyph" .github/workflows/placement-guard.yml; then
            echo "::error::placement-guard.yml still grandfathers lithoglyph — should FAIL now (extraction DONE)"
            exit 1
          fi
          if grep -q "GRANDFATHER='.*verisimdb" .github/workflows/placement-guard.yml; then
            echo "::error::placement-guard.yml still grandfathers verisimdb — should FAIL now"
            exit 1
          fi
          echo "Placement guard check PASS — lithoglyph/verisimdb not grandfathered, now FAIL on new files"

      - name: Summary
        run: |
          cat <<'EOF' >> $GITHUB_STEP_SUMMARY
          ## Foundational Checks — PASS

          All foundational fixes for #42, #45, #53 verified:

          - K9 pedigree: 7 files, 0 errors
          - A2ML: 36 files, 0 errors
          - Template residue: methodology.a2ml fixed, 0 active placeholders
          - ReScript/TS: 0 files in coordination paths (DONE via extraction)
          - Proof-debt: docs/proof-debt.adoc exists, no banned patterns
          - verisim-core AFFIRMATION: exists, current 2026-09-25
          - Lithoglyph/GNPL disentanglement: docs exist, pointer READMEs, split-history tags
          - Placement guard: lithoglyph/verisimdb not grandfathered, now FAIL

          See docs/governance/FOUNDATIONAL-FIXES-2026-09-25.adoc for full upstream/downstream/enduring analysis.
          EOF
